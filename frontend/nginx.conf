server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_buffering off;          # stream chat tokens as they arrive
        proxy_read_timeout 300s;
    }
    location / {
        try_files $uri /index.html;
    }
}
